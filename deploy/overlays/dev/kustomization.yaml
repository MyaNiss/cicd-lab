# dev 환경 — 네임스페이스 todo-dev. 파이프라인이 아래 images의 주소·태그를 바꿔 커밋하면 Argo CD가 이 폴더를 배포한다
# newName의 아이디 자리는 실습 2 7단계에서 내 GitHub 아이디(소문자)로 바꾼다
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: todo-dev
resources:
- ../../base
images:
- name: todo-api
  newName: ghcr.io/myaniss/cicd-lab/api
  newTag: jenkins-3
- name: todo-web
  newName: ghcr.io/myaniss/cicd-lab/web
  newTag: 2402436e654998515aa0041f124348b1fb190096
